name: lab13
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab13_admin
      POSTGRES_PASSWORD: lab13_admin_local
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
      PGPASSWORD: lab13_admin_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./postgres:/schemas:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U lab13_admin -d postgres && psql -h 127.0.0.1 -U lab13_admin -d notifications -tAc "SELECT 1 FROM notifications LIMIT 0"']
      interval: 2s
      timeout: 3s
      retries: 30
  user-service:
    build: ./user-service
    ports: ["8081:8080"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users_local
      POSTGRES_DB: users
    depends_on:
      postgres: {condition: service_healthy}
  order-service:
    build: ./order-service
    ports: ["8082:8080"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders_local
      POSTGRES_DB: orders
      USER_SERVICE_URL: http://user-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      postgres: {condition: service_healthy}
  notification-service:
    build: ./notification-service
    ports: ["8083:8080"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications_local
      POSTGRES_DB: notifications
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
